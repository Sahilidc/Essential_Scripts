input {
  http {
    host => "0.0.0.0"
    port => 8080
    codec => json
  }
}

filter {
  # Add a source label to make the starter/test events easy to find.
  mutate {
    add_field => { "[observer][name]" => "homelab-logstash" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "homelab-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => dots
  }
}
